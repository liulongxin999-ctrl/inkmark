name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连续推送时，取消上一次还没跑完的任务，避免浪费 Actions 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 自检与端到端测试 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: 静态检查（模块导入导出是否匹配）
        run: node tests/check-imports.mjs

      - name: 运行时自检（无头浏览器 + 真实 IndexedDB）
        run: node tests/run-headless.mjs

      - name: 端到端冒烟测试（上传 → 批注 → 术语 → 笔记）
        run: node tests/smoke.mjs
