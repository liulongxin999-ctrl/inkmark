name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连续推送时，取消上一次还没跑完的任务，避免浪费 Actions 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 自检与端到端测试 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: 数据防泄漏（私人数据绝不能进仓库）
        run: node tools/check-no-data.mjs

      - name: 启用提交钩子并回归测试防泄漏闸门
        run: |
          git config core.hooksPath .githooks
          node tests/data-guard.mjs

      - name: 静态检查（模块导入导出是否匹配）
        run: node tests/check-imports.mjs

      - name: 端口策略（绝不静默换端口导致存档不可见）
        run: node tests/server-ports.mjs

      - name: 生产路径与安全边界（8765 实际启动）
        run: node tests/production-path.mjs 8765

      - name: 运行时自检（无头浏览器 + 真实 IndexedDB）
        run: node tests/run-headless.mjs

      - name: 端到端冒烟测试（上传 → 批注 → 术语 → 笔记）
        run: node tests/smoke.mjs

      - name: 存档验证（关闭浏览器 / 强杀进程后数据仍在）
        run: node tests/persistence.mjs

      - name: 磁盘备份与一键恢复
        run: node tests/backup.mjs

      - name: 备份保留策略（每个地址各留 12 份，测试不会挤掉真实备份）
        run: node tests/backup-trim.mjs

      - name: 保存时机与询问流程（保存按钮 / Ctrl+S / 关闭时保存 / 过大的询问）
        run: node tests/backup-timing.mjs

      - name: 公式与插图渲染（KaTeX / zip 导入 / 跨公式批注锚点）
        run: node tests/render-rich.mjs
